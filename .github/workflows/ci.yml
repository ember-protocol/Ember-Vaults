name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

env:
  DOCKER_IMAGE: mysten/sui-tools:mainnet
  DOCKER_CACHE_KEY: sui-docker-mainnet-v1

jobs:
  setup:
    name: Setup Docker Image
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.docker-cache.outputs.cache-hit }}
    
    steps:
      - name: Cache Docker image
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-cache
          key: ${{ env.DOCKER_CACHE_KEY }}

      - name: Load Docker image from cache
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/.docker-cache/sui-mainnet.tar || true

      - name: Pull and cache Docker image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}
          mkdir -p /tmp/.docker-cache
          docker save ${{ env.DOCKER_IMAGE }} -o /tmp/.docker-cache/sui-mainnet.tar

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore Docker cache
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-cache
          key: ${{ env.DOCKER_CACHE_KEY }}

      - name: Load Docker image
        run: |
          if ! docker load -i /tmp/.docker-cache/sui-mainnet.tar; then
            docker pull ${{ env.DOCKER_IMAGE }}
          fi

      - name: Build Move project
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app ${{ env.DOCKER_IMAGE }} \
            sui move build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/
          retention-days: 7

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [setup, build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore Docker cache
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-cache
          key: ${{ env.DOCKER_CACHE_KEY }}

      - name: Load Docker image
        run: |
          docker load -i /tmp/.docker-cache/sui-mainnet.tar || docker pull ${{ env.DOCKER_IMAGE }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Run Move tests
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app ${{ env.DOCKER_IMAGE }} \
            sui move test

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore Docker cache
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-cache
          key: ${{ env.DOCKER_CACHE_KEY }}

      - name: Load Docker image
        run: |
          docker load -i /tmp/.docker-cache/sui-mainnet.tar || docker pull ${{ env.DOCKER_IMAGE }}

      - name: Check Move formatting
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app ${{ env.DOCKER_IMAGE }} \
            sui move build --lint

  status-check:
    name: All Checks Complete
    runs-on: ubuntu-latest
    needs: [build, test, lint]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "Build: ${{ needs.build.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          
          if [[ "${{ needs.build.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Some checks failed"
            exit 1
          else
            echo "✅ All critical checks passed"
          fi